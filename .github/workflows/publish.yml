name: Publish (main)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to publish, for example v1.5.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Read VERSION
        id: version
        run: echo "tag=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Verify release tag matches VERSION
        env:
          RELEASE_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}
        run: test "v${{ steps.version.outputs.tag }}" = "$RELEASE_REF"

      - name: Build and push
        run: |
          docker build --platform ${{ matrix.platform }} \
            --build-arg GIT_SHA=${{ steps.sha.outputs.short }} \
            -t ghcr.io/kylejschultz/nestview:sha-${{ steps.sha.outputs.short }}-${{ matrix.suffix }} \
            -t ghcr.io/kylejschultz/nestview:${{ steps.version.outputs.tag }}-${{ matrix.suffix }} \
            -f Dockerfile \
            .
          docker push ghcr.io/kylejschultz/nestview:sha-${{ steps.sha.outputs.short }}-${{ matrix.suffix }}
          docker push ghcr.io/kylejschultz/nestview:${{ steps.version.outputs.tag }}-${{ matrix.suffix }}

  merge:
    runs-on: ubuntu-24.04
    needs: [build]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Read VERSION
        id: version
        run: echo "tag=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Merge manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/kylejschultz/nestview:latest \
            -t ghcr.io/kylejschultz/nestview:sha-${{ steps.sha.outputs.short }} \
            -t ghcr.io/kylejschultz/nestview:${{ steps.version.outputs.tag }} \
            ghcr.io/kylejschultz/nestview:sha-${{ steps.sha.outputs.short }}-amd64 \
            ghcr.io/kylejschultz/nestview:sha-${{ steps.sha.outputs.short }}-arm64

  announce:
    runs-on: ubuntu-24.04
    needs: [merge]
    if: ${{ vars.DISABLE_DISCORD_RELEASE_ANNOUNCEMENT != 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}

      - name: Set release SHA
        id: sha
        run: echo "full=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Send Discord release card
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          DISCORD_ANNOUNCEMENT_ROLE_ID: ${{ vars.DISCORD_ANNOUNCEMENT_ROLE_ID }}
          GITHUB_SHA: ${{ steps.sha.outputs.full }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 << 'EOF'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          webhook_url = os.environ.get("DISCORD_RELEASE_WEBHOOK_URL")
          if not webhook_url:
              print("DISCORD_RELEASE_WEBHOOK_URL is not configured; skipping Discord announcement.")
              sys.exit(0)

          with open("VERSION", encoding="utf-8") as version_file:
              version = version_file.read().strip()

          with open("CHANGELOG.md", encoding="utf-8") as changelog_file:
              changelog = changelog_file.read()

          section_match = re.search(
              rf"^## \[{re.escape(version)}\].*?\n(.*?)(?=\n---\n## |\Z)",
              changelog,
              re.MULTILINE | re.DOTALL,
          )
          release_notes = section_match.group(1).strip() if section_match else "See the changelog for release notes."
          if len(release_notes) > 1800:
              release_notes = release_notes[:1797].rstrip() + "..."

          short_sha = os.environ["GITHUB_SHA"][:7]
          repo_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
          announcement_role_id = os.environ.get("DISCORD_ANNOUNCEMENT_ROLE_ID", "").strip()

          def post_webhook(payload, *, with_components=False):
              suffix = "?with_components=true" if with_components else ""
              req = urllib.request.Request(
                  f"{webhook_url}{suffix}",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "nestview-release-bot/1.0",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      if response.status not in (200, 204):
                          raise RuntimeError(f"Discord webhook returned HTTP {response.status}")
              except urllib.error.HTTPError as exc:
                  print(exc.read().decode("utf-8", "replace"))
                  raise

          if announcement_role_id:
              post_webhook({
                  "username": "Nestview Releases",
                  "content": f"<@&{announcement_role_id}>",
                  "allowed_mentions": {
                      "parse": [],
                      "roles": [announcement_role_id],
                  },
              })

          payload = {
              "username": "Nestview Releases",
              "flags": 32768,
              "components": [
                  {
                      "type": 17,
                      "accent_color": 5793266,
                      "components": [
                          {
                              "type": 10,
                              "content": f"# Nestview v{version}\nA new main-line Nestview release is available.",
                          },
                          {"type": 14, "divider": True, "spacing": 1},
                          {
                              "type": 10,
                              "content": f"## What changed\n{release_notes}",
                          },
                          {"type": 14, "divider": True, "spacing": 1},
                          {
                              "type": 10,
                              "content": (
                                  "## Image tags\n"
                                  f"- `ghcr.io/kylejschultz/nestview:{version}`\n"
                                  "- `ghcr.io/kylejschultz/nestview:latest`"
                              ),
                          },
                          {
                              "type": 10,
                              "content": f"_Build `{short_sha}` - {repo_url}/releases_",
                          },
                      ],
                  }
              ],
          }

          post_webhook(payload, with_components=True)
          EOF
